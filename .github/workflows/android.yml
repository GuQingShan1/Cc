name: Android APK

on:
  push:
    branches: ["claude/cultivation-schedule-app-k145kf", "main"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cultivation-schedule.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cultivation-schedule-apk
          path: cultivation-schedule.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Cultivation Schedule (latest Android build)
          body: |
            Debug APK built from commit ${{ github.sha }}.

            Download `cultivation-schedule.apk` below on your Android phone and open it to install.
            Builds are signed with the same key, so new versions install over the old one.
          prerelease: true
          files: cultivation-schedule.apk
