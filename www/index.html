<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#12100e">
    <meta name="description" content="A cultivation-themed daily planner: plan your day in parts, earn Qi for what you finish, face tribulations and break through to higher stages.">
    <title>Cultivation Schedule</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2312100e'/%3E%3Cpath d='M32 50c-11 0-19-6-19-14 5.2 1 9.6 3.4 12 6.2-2-6.4-1.3-14.7 7-20.6 8.3 5.9 9 14.2 7 20.6 2.4-2.8 6.8-5.2 12-6.2 0 8-8 14-19 14z' fill='%23c9a24b'/%3E%3Cpath d='M32 21.6c-2-4.6-2-8.7 0-12 2 3.3 2 7.4 0 12z' fill='%23e8c877'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2312100e'/%3E%3Cpath d='M32 50c-11 0-19-6-19-14 5.2 1 9.6 3.4 12 6.2-2-6.4-1.3-14.7 7-20.6 8.3 5.9 9 14.2 7 20.6 2.4-2.8 6.8-5.2 12-6.2 0 8-8 14-19 14z' fill='%23c9a24b'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/views.css">
    <link rel="stylesheet" href="css/fx.css">
</head>
<body>
    <div id="bg" aria-hidden="true">
        <div class="bg-standin"></div>
        <div class="bg-art" data-layer="a"></div>
        <div class="bg-art" data-layer="b"></div>
        <div class="bg-veil"></div>
    </div>

    <div id="root">
        <header id="topbar">
            <button class="stage-chip" data-action="nav" data-view="cultivation" aria-label="Open cultivation">
                <span class="stage-chip__seal" id="stageSeal">I</span>
                <span class="stage-chip__name" id="stageName">Mortal</span>
            </button>
            <div class="qi-pill" id="qiPill">
                <span class="qi-pill__glyph" data-icon="qi"></span>
                <span class="qi-pill__value tabular" id="qiValue">0</span>
                <span class="qi-pill__unit">Qi</span>
            </div>
        </header>

        <main id="view"></main>

        <button id="fab" data-action="open-sheet" aria-label="Add a task"><span data-icon="plus"></span></button>

        <nav id="nav" aria-label="Views">
            <button data-action="nav" data-view="today" class="is-active"><span data-icon="today"></span>Today</button>
            <button data-action="nav" data-view="calendar"><span data-icon="calendar"></span>Calendar</button>
            <button data-action="nav" data-view="cultivation"><span data-icon="lotus"></span>Cultivation</button>
        </nav>

        <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
        <div id="overlay" class="overlay" hidden></div>
        <canvas id="fx" aria-hidden="true"></canvas>
    </div>

    <script src="js/icons.js"></script>
    <script src="js/game.js"></script>
    <script src="js/art.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/sheet.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
